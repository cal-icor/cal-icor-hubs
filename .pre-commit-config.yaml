# pre-commit is a tool to perform a predefined set of tasks manually and/or
# automatically before git commits are made.
#
# Config reference: https://pre-commit.com/#pre-commit-configyaml---top-level
#
# Common tasks
#
# - Run on all files:   pre-commit run --all-files
# - Register git hooks: pre-commit install --install-hooks
#
# .pre-commit-config.yaml
minimum_pre_commit_version: "4.4.0"

repos:
  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.4.2
    hooks:
      - id: tofu_fmt
      - id: terragrunt_fmt

  - repo: local
    hooks:
      - id: terragrunt_hcl_validate
        name: terragrunt hcl validate
        entry: terragrunt hcl validate --working-dir tofu
        language: system
        files: 'tofu/' # \.hcl$'
        pass_filenames: false

  - repo: https://github.com/terraform-docs/terraform-docs
    rev: v0.24.0
    hooks:
      - id: terraform-docs-go
        args: ["markdown", "table", "--output-file", "README.md", "--output-mode", "inject", "tofu/"]


  # yaml linter
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        # TODO: remove --no-warnings eventually
        args: [--no-warnings, -c=./.yamllint.yaml]

  # Autoformat: Python code
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [ python, pyi ]
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]

  # Autoformat: Python code, syntax patterns are modernized
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py36-plus

  # Autoformat: Python code
  - repo: https://github.com/pycqa/isort
    rev: "9.0.0"
    hooks:
      - id: isort

  # Autoformat: Python code
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "26.5.1"
    hooks:
      - id: black
        # This is a `.py` file but is encrypted with sops

  # Lint: Python code
  - repo: https://github.com/pycqa/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        # In case a `.py` file but is encrypted with sops
        # exclude:

  # Prevent unencrypted files from being committed
  - repo: https://github.com/yuvipanda/pre-commit-hook-ensure-sops
    rev: v1.1
    hooks:
      - id: sops-encryption
        # Add files here if they contain the word 'secret' but should not be encrypted
        exclude: deployments/template/{{cookiecutter\.hub_name}}/secrets/prod\.plain\.yaml

  # Prevent known typos from being committed
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          # Autofix known typos
          - --write-changes
        additional_dependencies:
          - tomli

  # pre-commit.com provided hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # ref: https://github.com/pre-commit/pre-commit-hooks#hooks-available
    hooks:
      # Autoformat: Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer

      # Autoformat: Sorts entries in requirements.txt.
      - id: requirements-txt-fixer

      # Lint: Check for files with names that would conflict on a
      # case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-case-conflict

      # Lint: Checks that non-binary executables have a proper shebang.
      - id: check-executables-have-shebangs

# pre-commit.ci config reference: https://pre-commit.ci/#configuration
ci:
  autoupdate_schedule: monthly
  skip:
    - tofu_fmt
    - terragrunt_fmt
    - terragrunt_hcl_validate
    - terraform-docs-go
