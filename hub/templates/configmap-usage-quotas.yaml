kind: ConfigMap
apiVersion: v1
metadata:
  name: usage-quotas-config
  labels:
    app: jupyterhub
data:
  jupyterhub_usage_quotas_config.py: |
    # JupyterHub sets JUPYTERHUB_PUBLIC_HUB_URL for single-user servers only, so
    # a service never receives it. Take it from the deployment's ingress host.
    {{- with .Values.jupyterhub.ingress.hosts }}
    c.UsageViewer.public_hub_url = "https://{{ first . }}"
    {{- end }}
    # Our home dirs use safe_slug (user-example-edu---4a3f4959); the viewer
    # defaults to legacy. This one sits here rather than in values.yaml
    # because python.literal has no dict case.
    c.UsageViewer.escape_username_scheme = {"directory": "safe", "pod": "safe", "max_length": 48}
    {{- range $name, $value := .Values.jupyterhub.hub.config.UsageViewer }}
    {{- if and (ne $value nil) (not (kindIs "map" $value)) }}
    c.UsageViewer.{{ $name }} = {{ include "python.literal" $value }}
    {{- end }}
    {{- end }}
