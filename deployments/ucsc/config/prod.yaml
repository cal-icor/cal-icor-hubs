nfsPVC:
  nfs:
    shareName: ucsc/prod

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "main"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: University of California, Santa Cruz
          logo_url: https://communications.ucsc.edu/wp-content/uploads/2021/04/2021-Logo-Do-2.jpg
          url: https://www.ucsc.edu/
  ingress:
    enabled: true
    hosts:
      - ucsc.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - ucsc.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        # temporarily disable token refresh to fix admin access to singleuser servers
        refresh_pre_spawn: false
        allowed_idps:
          urn:mace:incommon:ucsc.edu:
            default: true
            username_derivation:
              username_claim: "email"
            allow_all: true
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: "email"
        oauth_callback_url: https://ucsc.jupyter.cal-icor.org/hub/oauth_callback
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sknapp@berkeley.edu
          - abrsvn@ucsc.edu
          - jusimons@ucsc.edu
    loadRoles:
      cloudbank-pilot-hub-users:
        services:
          - cloudbank-pilot-hub-users
        scopes:
          - list:users
          - read:users
