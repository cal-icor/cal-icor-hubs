nfsPVC:
  nfs:
    shareName: shares/demo/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - demo.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - demo.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
        CILogonOAuthenticator:
          oauth_callback_url: https://demo.jupyter.cal-icor.org/hub/oauth_callback
