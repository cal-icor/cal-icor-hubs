nfsPVC:
  nfs:
    shareName: shares/demo/staging
  dirsizeReporter:
    enabled: false

jupyterhub:
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - demo-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - demo-staging.jupyter.cal-icor.org
