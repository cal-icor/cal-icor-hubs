nfsPVC:
  nfs:
    shareName: shares/lacc/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - lacc.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - lacc.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
      JupyterHub:
        authenticator_class: github
      GitHubOAuthenticator:
        oauth_callback_url: https://lacc.jupyter.cal-icor.org/hub/oauth_callback
        allowed_organizations:
          - LACC-Statistical-Data-Analytics
        scope:
          - read:org
      Authenticator:
        admin_users:
          - sean-morris
          - pineda0021