nfsPVC:
  nfs:
    shareName: shares/lacc/staging

jupyterhub:
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - lacc-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - lacc-staging.jupyter.cal-icor.org
  hub:
    config:
      GitHubOAuthenticator:
        oauth_callback_url: https://lacc-staging.jupyter.cal-icor.org/hub/oauth_callback
      
