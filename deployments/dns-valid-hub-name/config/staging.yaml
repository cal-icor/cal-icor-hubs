nfsPVC:
  nfs:
    shareName: dns-valid-hub-name/staging
  dirsizeReporter:
    enabled: false

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "username-and-password-homepage"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: CSU Channel Islands
          logo_url: https://www.csuci.edu/office-departments/marketing-communications/brand-guidelines/images/csucinewlogo.jpg
          url: https://www.csuci.edu/
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - dns-valid-hub-name-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - dns-valid-hub-name-staging.jupyter.cal-icor.org
  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - sknapp
          - eric_vandusen@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sean.smorris
          - isaac.qs@csuci.edu
