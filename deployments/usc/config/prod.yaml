nfsPVC:
  nfs:
    shareName: usc/prod

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "main"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: University of Southern California
          logo_url: https://identity.usc.edu/wp-content/uploads/2023/05/IdentitySite_MarksLogotypes_Card_606x330.png
          url: https://usc.edu/
  ingress:
    enabled: true
    hosts:
      - usc.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - usc.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        # temporarily disable token refresh to fix admin access to singleuser servers
        refresh_pre_spawn: false
        auth_refresh_age: 0
        allowed_idps:
          urn:mace:incommon:usc.edu:
            default: true
            username_derivation:
              username_claim: "email"
            allow_all: true
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: "email"
        oauth_callback_url: https://usc.jupyter.cal-icor.org/hub/oauth_callback
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sknapp@berkeley.edu
          - kristof@usc.edu
          - kwalther@usc.edu
    loadRoles:
      cloudbank-pilot-hub-users:
        services:
          - cloudbank-pilot-hub-users
        scopes:
          - list:users
          - read:users
