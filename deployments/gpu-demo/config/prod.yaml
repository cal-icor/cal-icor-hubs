nfsPVC:
  nfs:
    shareName: shares/gpu-demo/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - gpu-demo.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - gpu-demo.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
        CILogonOAuthenticator:
          oauth_callback_url: https://gpu-demo.jupyter.cal-icor.org/hub/oauth_callback
