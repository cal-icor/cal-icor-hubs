nfsPVC:
  nfs:
    shareName: gpu-demo/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - gpu-demo.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - gpu-demo.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    loadRoles:
      cloudbank-pilot-hub-users:
        services:
          - cloudbank-pilot-hub-users
        scopes:
          - list:users
          - read:users
  scheduling:
    userPlaceholder:
      enabled: false
