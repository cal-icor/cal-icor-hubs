nfsPVC:
  nfs:
    shareName: csufresno/staging
  dirsizeReporter:
    enabled: false

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "username-and-password-homepage"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: California State University, Fresno
          logo_url: https://marcomm.fresnostate.edu/images/fs-logo-color-stacked.jpg
          url: https://www.fresnostate.edu/index.html
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - csufresno-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - csufresno-staging.jupyter.cal-icor.org
  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - sknapp
          - eric_vandusen@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sean.smorris
          - earvin@csufresno.edu
          - ytanai@csufresno.edu
