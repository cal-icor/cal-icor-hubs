nfsPVC:
  nfs:
    shareName: csulb/staging
  dirsizeReporter:
    enabled: false

jupyterhub:
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - csulb-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - csulb-staging.jupyter.cal-icor.org
  hub:
    config:
      CILogonOAuthenticator:
        oauth_callback_url: https://csulb-staging.jupyter.cal-icor.org/hub/oauth_callback
