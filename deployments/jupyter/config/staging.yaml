nfsPVC:
  nfs:
    shareName: shares/jupyter/staging

jupyterhub:
  scheduling:
    userPlaceholder:
      enabled: false
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  proxy:
    https:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - staging.jupyter.cal-icor.org
    tls:
      - hosts:
        - staging.jupyter.cal-icor.org
        secretName: tls-cert
