nfsPVC:
 enabled: true
 nfs:
   serverIP: 34.118.238.48

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "username-and-password-homepage"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: Cal-ICOR Workshop Hub
          logo_url: https://www.cal-icor.org/images/logos/cal-icor.png
          url: https://cal-icor.org
  scheduling:
    userScheduler:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2026-03-05
  proxy:
    chp:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2026-03-05

  hub:
    nodeSelector:
      hub.jupyter.org/pool-name: core-pool-2026-03-05
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - denero
          - denero@berkeley.edu
          - yijunge
          - rylo
          - sknapp
          - felder
          - balajialwar
          - gmerritt
          - eric_vandusen@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sean.smorris
          - jonathanferrari@berkeley.edu
          - jonathanferrari
          - fraser@berkeley.edu
          - yanglisa@berkeley.edu
          - minrk

  singleuser:
    image:
      name: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/workshop-user-image
      tag: 730b12507846
    extraFiles:
      # DH-216
      remove-exporters:
        mountPath: /etc/jupyter/jupyter_notebook_config.py
        stringData: |
          c.QtPDFExporter.enabled = False
          c.QtPNGExporter.enabled = False
          c.WebPDFExporter.enabled = False
      opencode:
        # don't use highest-priority 'managed' path: /etc/opencode/opencode.json
        mountPath: /etc/opencode-default/opencode.json
        data:
          $schema: "https://opencode.ai/config.json"
          model: nrp/qwen3
          disabled_providers:
            - opencode
          provider:
            nrp:
              npm: "@ai-sdk/openai-compatible"
              name: NRP
              options:
                baseURL: "https://ellm.nrp-nautilus.io/v1"
                apiKey: "{env:OPENAI_API_KEY}"
              models:
                kimi:
                  name: kimi
                  limit:
                    "context": 262144
                    "output": 32768
                  options:
                    chat_template_kwargs:
                      "thinking": true
                      "preserve_thinking": true
                  variants:
                    instruct:
                      chat_template_kwargs:
                        thinking: false
                        preserve_thinking: false
                qwen3:
                  name: qwen3
                qwen3-small:
                  name: qwen3-small
                gpt-oss:
                  name: gpt-oss
                gemma:
                  name: gemma
                gemma-small:
                  name: gemma-small
                glm-5:
                  name: glm-5
                minimax-m2:
                  name: minimax-m2
    extraEnv:
      # Unset NotebookApp from hub/values. Necessary for recent lab versions.
      JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
      OPENCODE_CONFIG: /etc/opencode-default/opencode.json
    nodeSelector:
      hub.jupyter.org/pool-name: base-pool
    storage:
      type: static
      static:
        pvcName: home-nfs
        subPath: "{username}"
    memory:
      guarantee: 2G
      limit: 2G
