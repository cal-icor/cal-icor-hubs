nfsPVC:
  nfs:
    shareName: csun/prod

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "main"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: California State University, Northridge
          logo_url: https://upload.wikimedia.org/wikipedia/en/8/8c/CSUNS.svg
          url: https://www.csun.edu/
  ingress:
    enabled: true
    hosts:
      - csun.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - csun.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        # temporarily disable token refresh to fix admin access to singleuser servers
        refresh_pre_spawn: false
        allowed_idps:
          urn:mace:incommon:csun.edu:
            default: true
            username_derivation:
              username_claim: "email"
            allow_all: true
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: "email"
        oauth_callback_url: https://csun.jupyter.cal-icor.org/hub/oauth_callback
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sknapp@berkeley.edu
          - wayne.smith@csun.edu
    loadRoles:
      cloudbank-pilot-hub-users:
        services:
          - cloudbank-pilot-hub-users
        scopes:
          - list:users
          - read:users
