nfsPVC:
  nfs:
    shareName: csuf/staging
  dirsizeReporter:
    enabled: false

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "username-and-password-homepage"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: California State University, Fullerton
          logo_url: https://cdn.jsdelivr.net/gh/CSUF-Strat-Comm/campus-template@latest/_assets/images/csuf-wordmark.svg
          url: https://www.fullerton.edu/
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - csuf-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - csuf-staging.jupyter.cal-icor.org
  hub:
    config:
      JupyterHub:
        admin_access: true
        authenticator_class: dummy
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - sknapp
          - eric_vandusen@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sean.smorris
          - jjaynes@fullerton.edu
          - wpeng@fullerton.edu
          - dchandswang@fullerton.edu
