nfsPVC:
  nfs:
    shareName: shares/sage/staging

jupyterhub:
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - sage-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - sage-staging.jupyter.cal-icor.org
  hub:
    config:
      CILogonOAuthenticator:
        oauth_callback_url: https://sage-staging.jupyter.cal-icor.org/hub/oauth_callback
