# nfsPVC:
#   nfs:
#     shareName: TBD

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - staging.jupyter.cal-icor.org

  hub:
    db:
      pvc:
        # prod stores logs, so let's make it big
        storage: 10Gi

  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  proxy:
    https:
      hosts:
        - staging.jupyter.cal-icor.org
