#   nfs:
#     shareName: TBD
jupyterhub:
  scheduling:
    userPlaceholder:
      enabled: false
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  proxy:
    https:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - staging.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # prod stores logs, so let's make it big
        storage: 10Gi
