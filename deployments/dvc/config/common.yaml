nfsPVC:
  enabled: true
  nfs:
    serverIP: 34.118.238.48

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "main"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: Diablo Valley College
          logo_url: https://www.dvcinquirer.com/wp-content/uploads/2022/03/dvc-logo-sidebar.png
          url: https://www.dvc.edu/
  scheduling:
    userScheduler:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2026-06-30
  proxy:
    chp:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool-2026-06-30

  hub:
    nodeSelector:
      hub.jupyter.org/pool-name: core-pool-2026-06-30
    config:
      JupyterHub:
        authenticator_class: cilogon
      CILogonOAuthenticator:
        # temporarily disable token refresh to fix admin access to singleuser servers
        refresh_pre_spawn: false
        allowed_idps:
          http://login.microsoftonline.com/common/oauth2/v2.0/authorize:
            default: true
            username_derivation:
              username_claim: "email"
            allowed_domains:
              - dvc.edu
              - 4cd.edu
              - email.4cd.edu
              - insite.4cd.edu
              - losmedanos.edu
              - contracosta.edu
          http://google.com/accounts/o8/id:
            username_derivation:
              username_claim: "email"
            allowed_domains:
              - dvc.edu
      Authenticator:
        manage_groups: false
        admin_users:
          - jedwin321@berkeley.edu
          - sknapp@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - namato@dvc.edu
          - llo@dvc.edu
          - jazlin.dvc@gmail.com
          
    # loadRoles:
      # cal-icor staff
      # cal-icor-staff:
        # description: Enable admin for cal-icor staff
        # this role provides permissions to...
        # scopes:
        #   - admin-ui
        #   - admin:groups
        #   - admin:users
        #   - admin:servers
        #   - read:roles
        #   - read:hub
        #   - access:servers
        # this role will be assigned to...
        # groups:
        #   - course::1524699::group::all-admins
  singleuser:
    image:
      name: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image
      tag: 5cf46ed80906
    extraFiles:
      # DH-216
      remove-exporters:
        mountPath: /etc/jupyter/jupyter_notebook_config.py
        stringData: |
          c.QtPDFExporter.enabled = False
          c.QtPNGExporter.enabled = False
          c.WebPDFExporter.enabled = False
    extraEnv:
      # Unset NotebookApp from hub/values. Necessary for recent lab versions.
      JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
    nodeSelector:
      hub.jupyter.org/pool-name: user-pool-2026-07-07
    storage:
      type: static
      static:
        pvcName: home-nfs
        subPath: "{username}"
    memory:
      guarantee: 512M
      limit: 1G
