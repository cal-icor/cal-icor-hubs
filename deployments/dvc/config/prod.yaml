nfsPVC:
  nfs:
    shareName: shares/dvc/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - dvc.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - dvc.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
