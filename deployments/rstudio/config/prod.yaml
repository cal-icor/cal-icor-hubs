nfsPVC:
  nfs:
    shareName: jupyter/prod

jupyterhub:
  ingress:
    enabled: true
    hosts:
      - rstudio.workshop.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - rstudio.workshop.jupyter.cal-icor.org
  hub:
    db:
      pvc:
        # This also holds logs
        storage: 4Gi
    loadRoles:
      cloudbank-pilot-hub-users:
        services:
          - cloudbank-pilot-hub-users
        scopes:
          - list:users
          - read:users
