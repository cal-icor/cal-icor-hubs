# Dev-cluster hub. Generated by scripts/create_deployment.py, then reworked: the
# template targets prod (dated pool names, CILogon, hubploy), none of which applies
# to the dev cluster.

# The PV/PVC are NOT rendered by this release. deploy-dev-nfs-volume.yaml applies
# them separately: the NFS server's ClusterIP is only knowable after the
# jupyterhub-home-nfs chart deploys, and re-applying a volume on every hub redeploy
# buys nothing. This flag also gates the dirsize reporter, which mounts the same PVC.
nfsPVC:
  enabled: false

jupyterhub:
  custom:
    homepage:
      gitRepoBranch: "username-and-password-homepage"
      gitRepoUrl: "https://github.com/cal-icor/default-hub-homepage"
      templateVars:
        org:
          name: Cal-ICOR Dev Hub (ephemeral)
          logo_url: https://www.cal-icor.org/images/logos/cal-icor.png
          url: https://cal-icor.org

  # Dev pool names are role-only; prod's carry a date stamp.
  scheduling:
    userScheduler:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool
  proxy:
    chp:
      nodeSelector:
        hub.jupyter.org/pool-name: core-pool

  hub:
    nodeSelector:
      hub.jupyter.org/pool-name: core-pool
    config:
      # Shared password, built into jupyterhub core, so the hub image needs no extra
      # authenticator package. SharedPasswordAuthenticator would be nicer, but it is
      # not in the hub image and that image is shared with every prod hub. The
      # password lives in secrets/*.yaml under the sops-dev key.
      JupyterHub:
        authenticator_class: dummy
      Authenticator:
        manage_groups: false
        admin_users:
          # infrastructure
          - jedwin321@berkeley.edu
          - ericvd@berkeley.edu
          - sean.smorris@berkeley.edu
          - sknapp@berkeley.edu
          - sknapp

  singleuser:
    image:
      name: us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image
      tag: bde8b3293fd2
    extraFiles:
      # DH-216
      remove-exporters:
        mountPath: /etc/jupyter/jupyter_notebook_config.py
        stringData: |
          c.QtPDFExporter.enabled = False
          c.QtPNGExporter.enabled = False
          c.WebPDFExporter.enabled = False
    extraEnv:
      # Unset NotebookApp from hub/values. Necessary for recent lab versions.
      JUPYTERHUB_SINGLEUSER_APP: "jupyter_server.serverapp.ServerApp"
    nodeSelector:
      hub.jupyter.org/pool-name: user-pool
    storage:
      type: static
      static:
        pvcName: home-nfs
        subPath: "{username}"
    memory:
      guarantee: 512M
      limit: 1G
