nfsPVC:
  nfs:
    shareName: {{cookiecutter.hub_filestore_share}}/{{cookiecutter.hub_name}}/staging

jupyterhub:
  scheduling:
    userScheduler:
      replicas: 1
  prePuller:
    continuous:
      enabled: false
  ingress:
    enabled: true
    hosts:
      - {{cookiecutter.hub_name}}-staging.jupyter.cal-icor.org
    tls:
      - secretName: tls-cert
        hosts:
          - {{cookiecutter.hub_name}}-staging.jupyter.cal-icor.org
  hub:
    config:
      {{cookiecutter.authenticator_class_instance}}:
        oauth_callback_url: https://{{cookiecutter.hub_name}}-staging.jupyter.cal-icor.org/hub/oauth_callback
