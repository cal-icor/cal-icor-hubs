name: Additional Storage Request
description: Fill out this form to request additional storage for your JupyterHub instance.
title: Request Additional Storage
labels: ["storage", "request"]
assignees: ["shaneknapp", "sean-morris"]

body:
  - type: markdown
    attributes:
      value: "# Additional Storage Request Form"

  - type: dropdown
    id: hub_url
    attributes:
      label: Institution URL
      description: Hub that you are currently using for teaching/research
      options:
        - chicostate.jupyter.cal-icor.org
        - csub.jupyter.cal-icor.org
        - csueb.jupyter.cal-icor.org
        - csuf.jupyter.cal-icor.org
        - csufresno.jupyter.cal-icor.org
        - csula.jupyter.cal-icor.org
        - csulb.jupyter.cal-icor.org
        - csum.jupyter.cal-icor.org
        - csumb.jupyter.cal-icor.org
        - csun.jupyter.cal-icor.org
        - csus.jupyter.cal-icor.org
        - csusj.jupyter.cal-icor.org
        - csusonoma.jupyter.cal-icor.org
        - dvc.jupyter.cal-icor.org
        - folsomlake.jupyter.cal-icor.org
        - fresno.jupyter.cal-icor.org
        - jupyter.cal-icor.org
        - ucsc.jupyter.cal-icor.org
        - usc.jupyter.cal-icor.org
    validations:
      required: true

  - type: input
    attributes:
      label: Email Address
      description: "Please provide your email address so we can contact you regarding this request, and add a storage quota override for your hub."
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: "Please let us know how much storage you need, a reason and any other relevant details."
    validations:
      required: false
