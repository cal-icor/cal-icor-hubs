name: Deploy dev cluster (tofu)
# Converges or tears down the throwaway dev cluster from tofu/clusters/dev.

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      command:
        description: "plan, apply, or destroy"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      command:
        description: "terragrunt run --all command"
        type: choice
        options: [apply, plan, destroy]
        default: plan

concurrency:
  group: dev-cluster-tofu # serialize applies; the GCS backend also locks state
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.3"
  TERRAGRUNT_VERSION: "1.1.0"
  TG_TF_PATH: tofu
  TG_NON_INTERACTIVE: "true"

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: dev-infra
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.DEV_WIF_PROVIDER }}
          service_account: ${{ vars.DEV_INFRA_SA }}

      # An apply plans first; a failure here skips the apply below.
      - name: terragrunt run --all plan
        if: ${{ inputs.command == 'plan' || inputs.command == 'apply' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/dev
          tg_command: run --all plan
          tg_add_approve: "0"

      - name: terragrunt run --all apply
        if: ${{ inputs.command == 'apply' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/dev
          tg_command: run --all apply
          tg_add_approve: "0"

      # Unguarded, which is fine for a throwaway cluster.
      - name: terragrunt run --all destroy
        if: ${{ inputs.command == 'destroy' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/dev
          tg_command: run --all destroy
          tg_add_approve: "0"

      # Reapply the dev-deploy RBAC binding: a recreate drops it, and dev-deploy
      # cannot grant itself admin.
      - name: Get dev cluster credentials
        if: ${{ inputs.command == 'apply' }}
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.DEV_CLUSTER }}
          location: ${{ vars.DEV_ZONE }}
          project_id: ${{ vars.DEV_PROJECT }}

      - name: Grant dev-deploy cluster-admin in the dev cluster
        if: ${{ inputs.command == 'apply' }}
        run: kubectl apply -f dev/rbac/dev-deploy-admin.yaml
