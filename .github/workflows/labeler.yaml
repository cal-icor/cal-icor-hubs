name: "Pull Request Labeler"
on:
- pull_request_target

jobs:
  apply-labels:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/labeler@v6.1.0
        with:
          configuration-path: ".github/labeler.yml"
