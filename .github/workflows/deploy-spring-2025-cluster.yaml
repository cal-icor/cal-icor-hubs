name: Deploy spring-2025 cluster (tofu)
# Plans, applies, or destroys the spring-2025 tofu units in
# tofu/clusters/spring-2025.
#
# The control plane was created by hand (gcloud, regional), not tofu, so there's
# no cluster/ unit: run --all only touches the network and node pools. A destroy
# removes pools and network (still an outage) but never the control plane, so
# prod-deploy@'s cluster-admin RBAC binding survives.
#
# destroy runs only via workflow_call with command=destroy, which the
# orchestrator emits from a merged PR labelled tofu-destroy-spring-2025; this
# leaf's own dispatch has no destroy option.

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      command:
        description: "plan, apply, or destroy"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      command:
        description: "terragrunt run --all command"
        type: choice
        options: [apply, plan]
        default: plan

concurrency:
  group: spring-2025-cluster-tofu # serialize applies; the GCS backend also locks state
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.3"
  TERRAGRUNT_VERSION: "1.1.0"
  TG_TF_PATH: tofu
  TG_NON_INTERACTIVE: "true"

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: prod-infra
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_INFRA_SA }}

      # plan with -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
      # continue-on-error lets the 2 through (it isn't a failure); the steps
      # below fail on 1, skip apply on 0, and apply on 2.
      - name: terragrunt run --all plan
        id: plan
        if: ${{ inputs.command == 'plan' || inputs.command == 'apply' }}
        continue-on-error: true
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/spring-2025
          tg_command: run --all -- plan -detailed-exitcode
          tg_add_approve: "0"

      # exit code 1 is a real plan error; fail the job.
      - name: Fail if the plan errored
        if: ${{ (inputs.command == 'plan' || inputs.command == 'apply') && steps.plan.outputs.tg_action_exit_code == '1' }}
        run: |
          echo "::error::terragrunt run --all plan failed"
          exit 1

      # no changes: skip the apply and say so.
      - name: Report no-op apply
        if: ${{ inputs.command == 'apply' && steps.plan.outputs.tg_action_exit_code == '0' }}
        run: echo "::notice::Plan found no changes; skipping apply."

      - name: terragrunt run --all apply
        if: ${{ inputs.command == 'apply' && steps.plan.outputs.tg_action_exit_code == '2' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/spring-2025
          tg_command: run --all apply
          tg_add_approve: "0"

      # Tears down pools+network only (the control plane is gcloud-made). Reached
      # only through a merged PR labelled tofu-destroy-spring-2025.
      - name: terragrunt run --all destroy
        if: ${{ inputs.command == 'destroy' }}
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_version: ${{ env.TERRAGRUNT_VERSION }}
          tg_dir: tofu/clusters/spring-2025
          tg_command: run --all destroy
          tg_add_approve: "0"
