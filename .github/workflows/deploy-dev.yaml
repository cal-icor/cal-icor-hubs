name: Deploy dev cluster stack
# Single entry point for the dev cluster.
# Order of operations:  cluster (tofu) -> support -> nfs -> nfs-volume -> hub.

permissions:
  contents: read
  id-token: write

# The leaf workflows serialize themselves, but only against their own kind. This keeps two
# runs from interleaving layers against the one shared cluster.
concurrency:
  group: dev-stack
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      cluster_command:
        description: "What to do with the cluster"
        type: choice
        options: [skip, plan, apply, destroy]
        default: plan
      deploy_support:
        description: "Deploy the support chart afterwards"
        type: boolean
        default: false
      deploy_nfs:
        description: "Deploy the jupyterhub-home-nfs chart afterwards"
        type: boolean
        default: false
      deploy_nfs_volume:
        description: "Apply the home PV/PVC (discovers the NFS ClusterIP)"
        type: boolean
        default: false
      deploy_hub:
        description: "Deploy the dev hub"
        type: boolean
        default: false
      hub_environment:
        description: "Which hub environment to deploy"
        type: choice
        options: [staging, prod]
        default: staging
  push:
    branches:
      - staging
      - prod

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      cluster_command: ${{ steps.decide.outputs.cluster_command }}
      deploy_support: ${{ steps.decide.outputs.deploy_support }}
      deploy_nfs: ${{ steps.decide.outputs.deploy_nfs }}
      deploy_nfs_volume: ${{ steps.decide.outputs.deploy_nfs_volume }}
      deploy_hub: ${{ steps.decide.outputs.deploy_hub }}
      hub_environment: ${{ steps.decide.outputs.hub_environment }}
    steps:
      - name: Get PR labels
        id: pr-labels
        if: github.event_name == 'push'
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide which layers to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LABELS: ${{ steps.pr-labels.outputs.labels }}
          CMD: ${{ inputs.cluster_command }}
          SUPPORT: ${{ inputs.deploy_support }}
          NFS: ${{ inputs.deploy_nfs }}
          NFS_VOLUME: ${{ inputs.deploy_nfs_volume }}
          HUB: ${{ inputs.deploy_hub }}
          HUB_ENV: ${{ inputs.hub_environment }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            cluster_command="$CMD"
            deploy_support="$SUPPORT"
            deploy_nfs="$NFS"
            deploy_nfs_volume="$NFS_VOLUME"
            deploy_hub="$HUB"
            hub_environment="$HUB_ENV"
          else
            cluster_command=skip
            deploy_support=false
            deploy_nfs=false
            deploy_nfs_volume=false
            deploy_hub=false

            if [[ "$REF" == "refs/heads/prod" ]]; then
              hub_environment=prod
            else
              hub_environment=staging
            fi

            for label in $LABELS; do
              case "$label" in
                tofu-dev)       cluster_command=apply ;;
                support-dev)    deploy_support=true ;;
                nfs-dev)        deploy_nfs=true ;;
                nfs-volume-dev) deploy_nfs_volume=true ;;
                hub-dev)        deploy_hub=true ;;
              esac
            done

            # The shared layers deploy from staging only, so a prod merge promotes the
            # hub and nothing else.
            if [[ "$REF" == "refs/heads/prod" ]]; then
              cluster_command=skip
              deploy_support=false
              deploy_nfs=false
              deploy_nfs_volume=false
            fi
          fi

          # A destroy leaves nothing for the helm layers to deploy into.
          if [[ "$cluster_command" == "destroy" ]]; then
            deploy_support=false
            deploy_nfs=false
            deploy_nfs_volume=false
            deploy_hub=false
          fi

          {
            echo "cluster_command=$cluster_command"
            echo "deploy_support=$deploy_support"
            echo "deploy_nfs=$deploy_nfs"
            echo "deploy_nfs_volume=$deploy_nfs_volume"
            echo "deploy_hub=$deploy_hub"
            echo "hub_environment=$hub_environment"
          } >> "$GITHUB_OUTPUT"
          echo "Cluster: $cluster_command  Support: $deploy_support  NFS: $deploy_nfs" \
               "NFS volume: $deploy_nfs_volume  Hub: $deploy_hub ($hub_environment)"

  # Each job below runs if no layer before it failed (skipped is fine) and the gate says to.
  cluster:
    needs: gate
    if: ${{ needs.gate.outputs.cluster_command != 'skip' }}
    uses: ./.github/workflows/deploy-dev-cluster.yaml
    with:
      command: ${{ needs.gate.outputs.cluster_command }}
    permissions:
      contents: read
      id-token: write

  support:
    needs: [gate, cluster]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_support == 'true' }}
    uses: ./.github/workflows/deploy-dev-support.yaml
    permissions:
      contents: read
      id-token: write

  nfs:
    needs: [gate, cluster, support]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs.yaml
    permissions:
      contents: read
      id-token: write

  # Must follow nfs, because it reads the ClusterIP from the running home-nfs Service.
  nfs-volume:
    needs: [gate, cluster, support, nfs]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs_volume == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs-volume.yaml
    permissions:
      contents: read
      id-token: write

  hub:
    needs: [gate, cluster, support, nfs, nfs-volume]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_hub == 'true' }}
    uses: ./.github/workflows/deploy-dev-hub.yaml
    with:
      environment: ${{ needs.gate.outputs.hub_environment }}
    permissions:
      contents: read
      id-token: write
