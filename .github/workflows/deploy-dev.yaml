name: Deploy dev cluster stack

# Single entry point for the dev cluster. Owns the label gate and the ordering:
#
#   cluster (tofu, dev-infra) -> support (helm) -> nfs (helm) -> nfs-volume -> hub
#
# `needs:` keeps each layer from racing the one before it, and skips it if that one
# fails. Each called workflow names its own environment: the layers use different SAs.
#
# nfs-volume sits between nfs and hub because it reads the NFS server's ClusterIP out
# of the cluster and writes the PV/PVC the hub's user pods mount. It is its own layer,
# not part of the hub deploy, so redeploying a hub does not re-apply a volume.
#
# Merge to staging picks layers by PR label: tofu-dev -> cluster, support-dev ->
# support, nfs-dev -> nfs, nfs-volume-dev -> nfs-volume, hub-dev -> hub.
#
# The hub follows the same staging -> prod promotion as the prod hubs: a merge to
# `staging` deploys the staging hub, and the later staging -> prod merge deploys the
# prod hub. Only the hub is per-environment. The cluster and the support, nfs, and
# nfs-volume layers are single cluster-wide instances shared by both hubs, so they only
# ever deploy from staging and are forced off on a prod merge.
#
# A merge never destroys; teardown is a dispatch, and destroying the cluster takes the
# helm releases with it.

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      cluster_command:
        description: "What to do with the cluster"
        type: choice
        options: [skip, plan, apply, destroy]
        default: plan
      deploy_support:
        description: "Deploy the support chart afterwards"
        type: boolean
        default: false
      deploy_nfs:
        description: "Deploy the jupyterhub-home-nfs chart afterwards"
        type: boolean
        default: false
      deploy_nfs_volume:
        description: "Apply the home PV/PVC (discovers the NFS ClusterIP)"
        type: boolean
        default: false
      deploy_hub:
        description: "Deploy the dev hub"
        type: boolean
        default: false
      hub_environment:
        description: "Which hub environment to deploy"
        type: choice
        options: [staging, prod]
        default: staging
  push:
    branches:
      - staging
      - prod

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      cluster_command: ${{ steps.decide.outputs.cluster_command }}
      deploy_support: ${{ steps.decide.outputs.deploy_support }}
      deploy_nfs: ${{ steps.decide.outputs.deploy_nfs }}
      deploy_nfs_volume: ${{ steps.decide.outputs.deploy_nfs_volume }}
      deploy_hub: ${{ steps.decide.outputs.deploy_hub }}
      hub_environment: ${{ steps.decide.outputs.hub_environment }}
    steps:
      - name: Get PR labels
        id: pr-labels
        if: github.event_name == 'push'
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide which layers to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LABELS: ${{ steps.pr-labels.outputs.labels }}
          CMD: ${{ inputs.cluster_command }}
          SUPPORT: ${{ inputs.deploy_support }}
          NFS: ${{ inputs.deploy_nfs }}
          NFS_VOLUME: ${{ inputs.deploy_nfs_volume }}
          HUB: ${{ inputs.deploy_hub }}
          HUB_ENV: ${{ inputs.hub_environment }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            cluster_command="$CMD"
            deploy_support="$SUPPORT"
            deploy_nfs="$NFS"
            deploy_nfs_volume="$NFS_VOLUME"
            deploy_hub="$HUB"
            hub_environment="$HUB_ENV"
          else
            cluster_command=skip
            deploy_support=false
            deploy_nfs=false
            deploy_nfs_volume=false
            deploy_hub=false

            # The branch picks the hub environment, exactly as it does for the prod
            # hubs: staging deploys on a merge to staging, prod on the staging -> prod
            # merge.
            if [[ "$REF" == "refs/heads/prod" ]]; then
              hub_environment=prod
            else
              hub_environment=staging
            fi

            for label in $LABELS; do
              case "$label" in
                tofu-dev)       cluster_command=apply ;;
                support-dev)    deploy_support=true ;;
                nfs-dev)        deploy_nfs=true ;;
                nfs-volume-dev) deploy_nfs_volume=true ;;
                hub-dev)        deploy_hub=true ;;
              esac
            done

            # The cluster and the support, nfs and nfs-volume layers are one shared
            # instance each, not one per hub environment. They deploy from staging.
            # A prod merge promotes the hub and nothing else.
            if [[ "$REF" == "refs/heads/prod" ]]; then
              cluster_command=skip
              deploy_support=false
              deploy_nfs=false
              deploy_nfs_volume=false
            fi
          fi

          # Don't leave the helm layers chasing a cluster that's going away.
          if [[ "$cluster_command" == "destroy" ]]; then
            deploy_support=false
            deploy_nfs=false
            deploy_nfs_volume=false
            deploy_hub=false
          fi

          {
            echo "cluster_command=$cluster_command"
            echo "deploy_support=$deploy_support"
            echo "deploy_nfs=$deploy_nfs"
            echo "deploy_nfs_volume=$deploy_nfs_volume"
            echo "deploy_hub=$deploy_hub"
            echo "hub_environment=$hub_environment"
          } >> "$GITHUB_OUTPUT"
          echo "Cluster: $cluster_command  Support: $deploy_support  NFS: $deploy_nfs" \
               "NFS volume: $deploy_nfs_volume  Hub: $deploy_hub ($hub_environment)"

  cluster:
    needs: gate
    if: ${{ needs.gate.outputs.cluster_command != 'skip' }}
    uses: ./.github/workflows/deploy-dev-cluster.yaml
    with:
      command: ${{ needs.gate.outputs.cluster_command }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  support:
    needs: [gate, cluster]
    # Runs if cluster succeeded OR was skipped (support-only change); not if it failed.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_support == 'true' }}
    uses: ./.github/workflows/deploy-dev-support.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  nfs:
    needs: [gate, cluster, support]
    # Same rule: runs if the layers before it succeeded or were skipped, not if one
    # failed. NFS doesn't depend on the support chart, but ordering it keeps a
    # from-scratch rebuild in one predictable sequence.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  nfs-volume:
    needs: [gate, cluster, support, nfs]
    # Must follow nfs: it reads the ClusterIP off the running home-nfs Service. Its own
    # layer, so a hub redeploy doesn't re-apply the volume.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs_volume == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs-volume.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  hub:
    needs: [gate, cluster, support, nfs, nfs-volume]
    # Last: the user pods mount the PVC that nfs-volume applies.
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_hub == 'true' }}
    uses: ./.github/workflows/deploy-dev-hub.yaml
    with:
      environment: ${{ needs.gate.outputs.hub_environment }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
