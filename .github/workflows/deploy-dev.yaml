name: Deploy dev cluster stack
# Single entry point for the dev cluster.
# Order of operations:  cluster (tofu) -> support -> nfs -> nfs-volume -> hub.

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

# Serialize the whole stack; leaf workflows only serialize against themselves.
concurrency:
  group: dev-stack
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      cluster_command:
        description: "What to do with the cluster"
        type: choice
        options: [skip, plan, apply, destroy]
        default: plan
      deploy_support:
        description: "Deploy the support chart afterwards"
        type: boolean
        default: false
      deploy_nfs:
        description: "Deploy the jupyterhub-home-nfs chart afterwards"
        type: boolean
        default: false
      deploy_nfs_volume:
        description: "Apply the home PV/PVC (discovers the NFS ClusterIP)"
        type: boolean
        default: false
      deploy_hub:
        description: "Deploy the dev hub"
        type: boolean
        default: false
      hub_environment:
        description: "Which hub environment to deploy"
        type: choice
        options: [staging, prod]
        default: staging
  push:
    branches:
      - staging
      - prod

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      cluster_command: ${{ steps.decide.outputs.cluster_command }}
      deploy_support: ${{ steps.decide.outputs.deploy_support }}
      deploy_nfs: ${{ steps.decide.outputs.deploy_nfs }}
      deploy_nfs_volume: ${{ steps.decide.outputs.deploy_nfs_volume }}
      deploy_hub: ${{ steps.decide.outputs.deploy_hub }}
      hub_environment: ${{ steps.decide.outputs.hub_environment }}
    steps:
      - name: Get PR labels
        id: pr-labels
        if: github.event_name == 'push'
        uses: irby/get-labels-on-push@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the YAML parser
        run: pip install ruamel.yaml==0.19.1

      # The dev spec decide-layers.py reads; prod passes its own. Field
      # definitions are in the script's docstring.
      - name: Decide which layers to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LABELS: ${{ steps.pr-labels.outputs.labels }}
          LAYER_SPEC: |
            shared_branch: staging
            environment_output: hub_environment
            layers:
              # tofu cluster: apply or skip, and destroy via dispatch.
              - output: cluster_command
                label: tofu-dev
                shared_branch_only: true
                when_on: apply
                when_off: skip
              # support chart.
              - output: deploy_support
                label: support-dev
                shared_branch_only: true
              # in-cluster NFS server.
              - output: deploy_nfs
                label: nfs-dev
                shared_branch_only: true
              # NFS home-directory volume/PV layer.  Always re-applied when the
              # NFS server deploys: a re-created server can change the ClusterIP,
              # and the PV's spec.nfs is immutable, so it must be recreated.
              - output: deploy_nfs_volume
                label: nfs-volume-dev
                shared_branch_only: true
                implied_by: deploy_nfs
              # the hub itself: promoted per-branch (staging->staging, prod->prod).
              - output: deploy_hub
                label: hub-dev
                shared_branch_only: false
          DISPATCH_INPUTS: |
            cluster_command: "${{ inputs.cluster_command }}"
            deploy_support: "${{ inputs.deploy_support }}"
            deploy_nfs: "${{ inputs.deploy_nfs }}"
            deploy_nfs_volume: "${{ inputs.deploy_nfs_volume }}"
            deploy_hub: "${{ inputs.deploy_hub }}"
            hub_environment: "${{ inputs.hub_environment }}"
        run: python .github/scripts/decide-layers.py

  # Each job below runs if no layer before it failed (skipped is fine) and the gate says to.
  cluster:
    needs: gate
    if: ${{ needs.gate.outputs.cluster_command != 'skip' }}
    uses: ./.github/workflows/deploy-dev-cluster.yaml
    with:
      command: ${{ needs.gate.outputs.cluster_command }}
    permissions:
      contents: read
      id-token: write

  support:
    needs: [gate, cluster]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_support == 'true' }}
    uses: ./.github/workflows/deploy-dev-support.yaml
    permissions:
      contents: read
      id-token: write

  nfs:
    needs: [gate, cluster, support]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs.yaml
    permissions:
      contents: read
      id-token: write

  # Must follow nfs, because it reads the ClusterIP from the running home-nfs Service.
  nfs-volume:
    needs: [gate, cluster, support, nfs]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_nfs_volume == 'true' }}
    uses: ./.github/workflows/deploy-dev-nfs-volume.yaml
    permissions:
      contents: read
      id-token: write

  hub:
    needs: [gate, cluster, support, nfs, nfs-volume]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.deploy_hub == 'true' }}
    uses: ./.github/workflows/deploy-dev-hub.yaml
    with:
      environment: ${{ needs.gate.outputs.hub_environment }}
    permissions:
      contents: read
      id-token: write
