# add labels for code changes
python:
  - '**/*.py'
R-code:
  - '**/*.R'
  - '**/*.r'
bash:
  - '**/*.sh'
  - '**/*.bash'
  - '**/postBuild'
dockerfile:
  - '**/Dockerfile'

# add labels for non-singleuser image config changes
configuration:
  - 'configs/**'
  - '**/requirements.in'
  - '**/dev-requirements.txt'
  - '**/requirements.txt'
  - '**/runtime.txt'
  - '**/*.json'
  - '**/*.yml'
  - '**/*.yaml'

template:
  - 'deployments/template/**'

# changes to hub images
hub-images:
  - 'images/**'

# images
images:
  - '**/*.png'
  - '**/*.svg'

# add labels to docs
documentation:
  - any: ['**/*.txt',  '!**/apt.txt', '!**/dev-requirements.txt', '!**/requirements.txt', '!**/runtime.txt']
  - 'docs/**'
  - '**/*.md'
  - 'LICENSE'

# add build-infra label to any .github or circleci changes
build-infra:
  - any: ['.github/**', '!.github/ISSUE_TEMPLATE/**']
  - '.gitignore'

issue-templates:
  - '.github/ISSUE_TEMPLATE/**'

# helm chart infra
helm-config:
  - 'chartpress.yaml'
  - '**/Chart.yaml'
  - 'support/*.yaml'
  - 'hub/*.yaml'
  - 'dev/**/*.yaml'
  - '**/.helmignore'

# support systems
support-deployment:
  - 'support/**'

# jupyterhub-home-nfs chart
jupyterhub-home-nfs-deployment:
  - 'jupyterhub-home-nfs/**'

# grafana panel backups
grafana:
  - 'vendor/grafana/**'

# jupyterhub deployment
jupyterhub-deployment:
  - 'hub/**'

# general tofu changes
tofu:
  - 'tofu/**'

# terragrunt orchestration / wiring (root config + per-unit terragrunt.hcl)
terragrunt:
  - 'tofu/*.hcl'
  - 'tofu/**/*.hcl'

# reusable tofu modules
tofu-modules:
  - 'tofu/modules/**'

# live units for the spring-2025 cluster
tofu-spring-2025:
  - 'tofu/clusters/spring-2025/**'

# live units for the dev cluster (throwaway e2e pilot); RBAC rides along, the
# cluster workflow reapplies it
tofu-dev:
  - 'tofu/clusters/dev/**'
  - 'dev/rbac/**'

# support chart on the DEV cluster. NOT under support/**, which carries
# `support-deployment` and would deploy the PROD chart. Workflow edits don't
# deploy, same as prod.
support-dev:
  - 'dev/support-values.yaml'
  - 'dev/secrets.yaml'

# tofu cluster (control plane / VPC; dev creates its cluster via this module)
tofu-cluster:
  - 'tofu/modules/cluster/**'
  - 'tofu/clusters/dev/cluster/**'

# tofu networking (Cloud Router / NAT / egress IP / firewall)
tofu-network:
  - 'tofu/modules/network/**'
  - 'tofu/clusters/spring-2025/network/**'
  - 'tofu/clusters/dev/network/**'

# tofu node pools
tofu-nodepools:
  - 'tofu/modules/nodepools/**'
  - 'tofu/clusters/spring-2025/*pool*/**'
  - 'tofu/clusters/dev/*pool*/**'

# per-pool labels (filter PRs by which pool they touch, across clusters)
tofu-prometheus-pool:
  - 'tofu/clusters/spring-2025/prometheus-pool/**'
  - 'tofu/clusters/dev/prometheus-pool/**'

tofu-core-pool:
  - 'tofu/clusters/spring-2025/core-pool/**'
  - 'tofu/clusters/dev/core-pool/**'

tofu-support-pool:
  - 'tofu/clusters/spring-2025/support-pool/**'
  - 'tofu/clusters/dev/support-pool/**'

tofu-user-pool:
  - 'tofu/clusters/spring-2025/user-pool/**'
  - 'tofu/clusters/dev/user-pool/**'

