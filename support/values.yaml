cert-manager:
  nodeSelector:
    hub.jupyter.org/pool-name: support-pool-2026-07-07
  cainjector:
    nodeSelector:
      hub.jupyter.org/pool-name: support-pool-2026-07-07
  webhook:
    nodeSelector:
      hub.jupyter.org/pool-name: support-pool-2026-07-07
  # # Our cluster-internal DNS seems to cache aggressively in
  # # some cases. The cache is also more likely to be warm,
  # # causing issues when cert-manager tries to verify
  # # that the ACME http-01 challenge will succeed. Since
  # # Let's encrypt itself isn't going to use our cluster-local
  # # DNS, this causes false negatives - cert-manager thinks the
  # # challenge will fail, but in reality it will most likely not.
  podDnsPolicy: None
  podDnsConfig:
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
ingress-nginx:
  controller:
    config:
      # Let's preserve ability to have HTTP pages served under *.jupyter.cal-icor.org
      # when necessary. Ideally would not be, but I want to preserve that option.
      hsts-include-subdomains: "false"
      # Increasing these per https://kubernetes.github.io/ingress-nginx/user-guide/miscellaneous/#websockets
      # Possibly related to temporary kernel connectivity issues from websocket failures
      proxy-read-timeout: "7200"
      proxy-send-timeout: "7200"
    # Best effort guess on resource needs
    # We overprovision a little - issues here cause a full cluster outage
    nodeSelector:
      hub.jupyter.org/pool-name: core-pool-2026-06-30
    replicaCount: 3
    resources:
      limits:
        cpu: 2
        memory: 2Gi
      requests:
        cpu: 0.2
        memory: 384Mi
    service:
     # this IP is the wildcard DNS record for jupyter.cal-icor.org
     loadBalancerIP: 34.56.76.244
     # clusterIP: 34.56.76.244
    metrics:
      enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "10254"
    podLabels:
      hub.jupyter.org/network-access-proxy-http: 'true'

prometheus:
  # We were using network tags to restrict NFS access to just nodes from hub-cluster
  # However, it turns out packets coming from *pods* are *not* tagged with that, just from the nodes!
  # I'm guessing this is an intersection of how GKE works? I'm not sure.
  # Either way, I allowed TCP to port 9100 from 10.0.0.0/8 and it works fine.
  networkPolicy:
    enabled: true
  # pages PagerDuty; the receiver (with routing key) is in secrets.yaml
  alertmanager:
    enabled: true
    nodeSelector:
      hub.jupyter.org/pool-name: support-pool-2026-07-07
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    config:
      route:
        receiver: pagerduty
        group_by: [alertname, namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
  nodeExporter:
    tolerations:
      - effect: NoSchedule
        # Deploy onto user nodes
        key: hub.jupyter.org_dedicated
        value: user
    updateStrategy:
      type: RollingUpdate
  prometheus-pushgateway:
    enabled: false
  rbac:
    create: true
  # make sure we collect metrics on pods by app/component at least
  kube-state-metrics:
    nodeSelector:
      hub.jupyter.org/pool-name: support-pool-2026-07-07
    metricLabelsAllowlist:
      - pods=[app,component,hub.jupyter.org/username,app.kubernetes.io/component]
      - nodes=[*]
      - services=[app,component]
    metricAnnotationsAllowList:
      - pods=[hub.jupyter.org/username]

  server:
    nodeSelector:
      hub.jupyter.org/pool-name: prometheus-pool-2026-10-09
    resources:
      # Without this, prometheus can easily starve users
      requests:
        cpu: 500m
        memory: 8Gi
      limits:
        memory: 20Gi
    # merged with the chart's global defaults (scrape/eval intervals).
    # no rotation: ~10MB/day at current query rates, on the data PVC.
    global:
      query_log_file: /data/queries.log
    podLabels:
      # For HTTP access to the hub, to scrape metrics
      hub.jupyter.org/network-access-hub: 'true'
    persistentVolume:
      size: 1000Gi
      storageClass: ssd
      existingClaim: prometheus-data-2025-04-10
    retention: 365d
    # guardrail for large dataset queries: big queries (6m) can really spike memory usage and OOMs.
    # so, we'll cap the query, and we can run on a smaller node
    extraArgs:
      query.max-samples: 20000000
      query.timeout: 2m
      query.max-concurrency: 8
    strategy:
      # Can't really do rolling update, we have a persistent disk attached
      type: Recreate
    service:
      type: ClusterIP

  # severity must be a PagerDuty Events v2 value: critical, error, warning, info.
  # thresholds backtested against 30-90d of this prometheus on 2026-10-30.
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: hub-login
          rules:
            # 10-26 CILogon outage: fired 4m after onset; 0 false fires in 30d
            - alert: HubLoginFailures
              expr: |
                (
                  sum by (namespace) (increase(jupyterhub_request_duration_seconds_count{handler="oauthenticator.oauth2.OAuthCallbackHandler",code="400",namespace=~".*-prod"}[15m])) >= 5
                )
                /
                sum by (namespace) (increase(jupyterhub_request_duration_seconds_count{handler="oauthenticator.oauth2.OAuthCallbackHandler",namespace=~".*-prod"}[15m]))
                > 0.8
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Users cannot log in to {{ $labels.namespace }}: {{ $value | humanizePercentage }} of OAuth callbacks are failing with 400"
        - name: server-startup
          rules:
            - alert: ServerStartupFailures
              expr: |
                changes(
                  (max by (namespace) (jupyterhub_server_spawn_duration_seconds_count{status="failure",namespace=~".*-prod"}))[30m:1m]
                ) >= 2
              for: 0m
              labels:
                severity: critical
              annotations:
                summary: "At least two user servers failed to start in the last 30m on {{ $labels.namespace }}"
        - name: pod-health
          rules:
            # 07-29 outage (csudh/cpp/csusb) is the only match in 120d; deploy restarts don't trip it
            - alert: HubCrashLooping
              expr: |
                max by (namespace) (kube_pod_container_status_waiting_reason{container="hub",reason="CrashLoopBackOff",namespace=~".*-prod"}) == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Hub in {{ $labels.namespace }} has been in CrashLoopBackOff for 5m"
            - alert: ProxyRestarted
              expr: |
                (
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^proxy-.*",namespace=~".*-prod"})
                  -
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^proxy-.*",namespace=~".*-prod"} offset 10m)
                ) >= 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Proxy pod {{ $labels.pod }} in {{ $labels.namespace }} restarted; user sessions were dropped"
            # in-place nfs-server container restarts only; sidecar restarts don't page
            - alert: HomeNFSRestarted
              expr: |
                (
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^home-nfs-.*",container="nfs-server",namespace="jupyterhub-home-nfs"})
                  -
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^home-nfs-.*",container="nfs-server",namespace="jupyterhub-home-nfs"} offset 10m)
                ) >= 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "home-nfs nfs-server container in {{ $labels.pod }} restarted; all hubs lost home directories"
            # catches pod replacement/pending/node loss. deploys and node moves
            # (upgrades) took <=60s at 0 available over 90d, so 2m doesn't fire on them.
            - alert: HomeNFSUnavailable
              expr: |
                max(kube_deployment_status_replicas_available{namespace="jupyterhub-home-nfs",deployment="home-nfs"}) < 1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "home-nfs has had no available pod for 2m; all hubs have lost home directories"
            - alert: PrometheusRestarted
              expr: |
                (
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^support-prometheus-server-.*",namespace="support"})
                  -
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^support-prometheus-server-.*",namespace="support"} offset 10m)
                ) >= 1
              for: 5m
              labels:
                severity: error
              annotations:
                summary: "Prometheus pod {{ $labels.pod }} restarted; alerting was blind while it was down"
            - alert: GrafanaRestarted
              expr: |
                (
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^support-grafana-.*",namespace="support"})
                  -
                  sum by (pod, namespace) (kube_pod_container_status_restarts_total{pod=~"^support-grafana-.*",namespace="support"} offset 10m)
                ) >= 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Grafana pod {{ $labels.pod }} restarted"
        - name: prometheus-disk
          rules:
            - alert: PrometheusDiskAlmostFull
              expr: |
                floor(
                  min by (namespace) (kubelet_volume_stats_available_bytes{persistentvolumeclaim="prometheus-data-2025-04-10"})
                  /
                  min by (namespace) (kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="prometheus-data-2025-04-10"})
                  * 100
                ) <= 10
              for: 5m
              labels:
                severity: error
              annotations:
                summary: "Prometheus data disk has {{ $value }}% free; grow prometheus-data-2025-04-10"

grafana:
  assertNoLeakedSecrets: false
  nodeSelector:
    hub.jupyter.org/pool-name: support-pool-2026-07-07
  deploymentStrategy:
    type: Recreate

  persistence:
    enabled: true
    storageClassName: standard

  service:
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      # Increase timeout for each query made by the grafana frontend to the
      # grafana backend to 2min, which is the default timeout for prometheus
      # queries. This also matches the timeout for the dataproxy in grafana,
      # set under `grafana.ini` below. These two timeouts are set together
      # to allow prometheus the best chance of executing queries we care about.
      # See: https://github.com/2i2c-org/infrastructure/pull/2942
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"

      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.jupyter.cal-icor.org
    tls:
    - hosts:
      - grafana.jupyter.cal-icor.org
      secretName: grafana-https-auto-tls

  grafana.ini:
    # dataproxy is used to make requests to prometheuses via the backend.
    # This allows authless access to prometheus server in the same namespace.
    dataproxy:
      # See: https://github.com/2i2c-org/infrastructure/pull/2942
      # Enable logging so we can debug grafana timeouts
      logging: true
      # Default prometheus query timeout is 120s, so let's allow grafana to
      # wait until that much time.
      # See https://prometheus.io/docs/prometheus/latest/command-line/prometheus/
      # for default prometheus query timeouts.
      # Because our grafana is behind an nginx ingress, this should match the
      # read timeout set above under `ingress.annotations`.
      timeout: 120
    server:
      root_url: https://grafana.jupyter.cal-icor.org/

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: prometheus
          orgId: 1
          type: prometheus
          url: http://support-prometheus-server
          access: proxy
          isDefault: true
          editable: true

prometheus-statsd-exporter:
  nodeSelector:
    hub.jupyter.org/pool-name: support-pool-2026-07-07
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9102"
 
node-placeholder-scaler:
  image:
    repository: 
      us-central1-docker.pkg.dev/cal-icor-hubs/core/node-placeholder-scaler
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    # tag: ""

  # The URL of the public calendar to use for the node placeholder
  calendarUrl: 
    https://calendar.google.com/calendar/ical/c_35d90f50598c1472a4154c538bb49a21eabd8be93831d7de345d53fea8e19390%40group.calendar.google.com/public/basic.ics

  calendarTimezone: "America/Los_Angeles"
  calendarOverrideEnabled: True

  nodeSelector:
    hub.jupyter.org/pool-name: support-pool-2026-07-07

  recentlyFreedGracePeriod: 300 # time in seconds

  # cpuThreshold: 0.25 # ignore this as our workloads are memory-bound, not cpu
  memoryThreshold: 0.35 # set this pretty high to avoid overloading nodes and get new ones spun up earlier
  scalingStrategy: "mem" # Options: cpu, mem, balanced (default)
  
  nodePools:
    # short name of the node pool, used in the calendar event description
    base:
      nodeSelector:
        hub.jupyter.org/pool-name: user-pool-2026-07-07
      resources:
        requests:
          # Some value slightly lower than allocatable RAM on the nodepool
          # This is an example using a GCP n2-highmem-8 node with 64G of RAM allocatable
          memory: 60929654784
      replicas: 1
    workshop:
      nodeSelector:
        hub.jupyter.org/pool-name: workshop-pool-2026-07-07
      resources:
        requests:
          # Some value slightly lower than allocatable RAM on the nodepool
          # This is an example using a GCP n2d-highmem-16 node with 128G of RAM allocatable
          memory: 124387962624
      replicas: 0
