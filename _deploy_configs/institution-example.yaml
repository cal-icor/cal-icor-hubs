# This is an example of a configuration file for a JupyterHub deployment.
# This file should be copied to <name of deployment>.yaml and kept in the
# _deploy_configs directory.
hub_name: # this will be the dns friendly name of the hub. eg: <hub_name>.jupyter.cal-icor.org
institution: # the name of the institution, e.g., "Cuesta College"
institution_url: # self explanatory, e.g., "https://www.cuesta.edu"
institution_logo_url: # check each institution's website for a branding section to find the logo URL
image_name: # remove or leave blank for base user image. full image path e.g. us-central1-docker.pkg.dev/cal-icor-hubs/user-images/base-user-image
image_tag: # remove or leave blank for base user image.  this is the short image tag created by repo2docker, e.g. 7509a8e7435f
hub_type: python-base # if not included, defaults to python-base.  other options are rstudio-base
hub_nfs_mount_path: # leave blank to use hub_name as the NFS mount path; set to share an existing mount with another hub (e.g. csumb)
hub_nfs_server_ip: 34.118.238.48
landing_page_branch: main
prod:
  client:
  secret:
admin_emails:
  - 
authenticator_class: cilogon # This is either cilogon or github
authenticator_class_instance: "CILogonOAuthenticator" # This is either "CILogonOAuthenticator" or "GitHubOAuthenticator"
idp_url: "" # cilogon only e.g.  http://login.microsoftonline.com/common/oauth2/v2.0/authorize
idp_allowed_domains: "" # cilogon only: Microsoft or Google Auth Schemes only  e.g, This is an empty string or a yaml list e.g. - my.cuesta.edu
allow_all: "" # cilogon only: Shibboleth or inCommon auth schemes set allow_all to true; this is an empty string for google and microsoft auth schemes
allowed_organizations: "" # github only: This is an empty string or This is a yaml list e.g. - LACC-Statistical-Data-Analytics
